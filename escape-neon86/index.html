<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Escape game numérique pour la formation numérique en 1re secondaire (eSCIENCES).">

<body>
